<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 330" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Domain model: land cover, slope, protected areas, communal grazing and road distance go through availability rules to an availability result; combined with suitability it becomes the available land record for stage 04.">
<rect width="1030" height="330" fill="#fbfaf6"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<text x="515" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2a20">Land availability domain model</text>
<g font-size="12" fill="#1f2a20">
  <!-- inputs -->
  <rect x="20" y="52" width="210" height="232" rx="8" fill="#f1e8d6" stroke="#74582a"/>
  <text x="125" y="74" text-anchor="middle" font-weight="bold">Input layers (per cell)</text>
  <text x="34" y="102">LandCover: cropland, grassland,</text><text x="34" y="118">shrub, forest, water, wetland,</text><text x="34" y="134">built-up, bare</text>
  <text x="34" y="160">slope_pct (from the DEM)</text>
  <text x="34" y="184">protected: reserves,</text><text x="34" y="200">church forests</text>
  <text x="34" y="224">grazing: communal land</text>
  <text x="34" y="248">road_km: distance to a road</text>
  <text x="34" y="272" fill="#5d665e">co-registered grids</text>
  <!-- rules -->
  <rect x="280" y="52" width="220" height="110" rx="8" fill="#dde8f3" stroke="#2f5d8a"/>
  <text x="390" y="74" text-anchor="middle" font-weight="bold">AvailabilityRules (value)</text>
  <text x="294" y="100">max slope 30% (excluded above)</text><text x="294" y="118">terraces from 15%</text><text x="294" y="136">water buffer 30 m</text><text x="294" y="154">remote beyond 5 km of a road</text>
  <rect x="280" y="180" width="220" height="104" rx="8" fill="#dde8f3" stroke="#2f5d8a"/>
  <text x="390" y="202" text-anchor="middle" font-weight="bold">Reason (bit flags)</text>
  <text x="294" y="226">hard: forest, water, wetland,</text><text x="294" y="242">built-up, protected, very steep,</text><text x="294" y="258">buffer, bare</text><text x="294" y="276">soft: terraces, grazing, remote</text>
  <!-- service -->
  <rect x="550" y="52" width="200" height="110" rx="8" fill="#1f2a20"/>
  <text x="650" y="74" text-anchor="middle" font-weight="bold" fill="#fff">Availability service</text>
  <text x="564" y="100" fill="#fff">assess_availability()</text><text x="564" y="118" fill="#fff">available_and_suitable()</text><text x="564" y="136" fill="#fff">explain(cell)</text>
  <rect x="550" y="180" width="200" height="104" rx="8" fill="#e3efdd" stroke="#3f6b34"/>
  <text x="650" y="202" text-anchor="middle" font-weight="bold">AvailabilityResult</text>
  <text x="564" y="226">status: in use, expandable,</text><text x="564" y="242">conditional, excluded</text><text x="564" y="258">reasons per cell</text><text x="564" y="274">hectares by status</text>
  <!-- outputs -->
  <rect x="800" y="52" width="210" height="110" rx="8" fill="#e3efdd" stroke="#3f6b34"/>
  <text x="905" y="74" text-anchor="middle" font-weight="bold">SuitabilityAssessment</text>
  <text x="814" y="100">rank S1 to N per crop</text><text x="814" y="118">(existing stage 01 engine)</text>
  <rect x="800" y="180" width="210" height="104" rx="8" fill="#f5e1d7" stroke="#9a4a28" stroke-width="2"/>
  <text x="905" y="202" text-anchor="middle" font-weight="bold">AvailableLand (output)</text>
  <text x="814" y="226">per planning cluster:</text><text x="814" y="242">ha by status, and ha both</text><text x="814" y="258">available and S1/S2 per crop</text><text x="814" y="276">to stages 02 and 04</text>
</g>
<g stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#a)">
  <path d="M230 120 L278 110"/><path d="M500 107 L548 107"/><path d="M500 232 L548 232"/>
  <path d="M650 162 L650 178"/><path d="M750 232 L798 232"/><path d="M905 162 L905 178"/>
</g>
</svg>
