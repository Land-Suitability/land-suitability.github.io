<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#fbfaf6"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2a20">Monthly water budget: two sides, compared month by month</text>

  <!-- supply side -->
  <text x="40" y="62" font-size="14" font-weight="bold" fill="#2f5d8a">SUPPLY SIDE</text>
  <g font-size="12" fill="#222">
    <rect x="40" y="75" width="150" height="120" rx="10" fill="#dde8f3" stroke="#2f5d8a"/>
    <text x="115" y="97" text-anchor="middle" font-weight="bold">Physical sources</text>
    <text x="52" y="120">River flow (gauges,</text>
    <text x="52" y="137">rainfall-runoff model)</text>
    <text x="52" y="160">Groundwater recharge</text>
    <text x="52" y="177">(field hydrogeology)</text>

    <rect x="215" y="75" width="170" height="120" rx="10" fill="#dde8f3" stroke="#2f5d8a"/>
    <text x="300" y="97" text-anchor="middle" font-weight="bold">Sustainability filters</text>
    <text x="227" y="120">Keep environmental flow</text>
    <text x="227" y="137">in the river</text>
    <text x="227" y="160">Abstract only a share</text>
    <text x="227" y="177">of annual recharge</text>

    <rect x="410" y="75" width="160" height="120" rx="10" fill="#dde8f3" stroke="#2f5d8a"/>
    <text x="490" y="97" text-anchor="middle" font-weight="bold">Infrastructure limit</text>
    <text x="422" y="120">Canal / pump capacity</text>
    <text x="422" y="143">Downstream users'</text>
    <text x="422" y="160">agreed shares</text>
    <text x="422" y="183" font-style="italic" fill="#24476a">= sustainable supply</text>
  </g>
  <g stroke="#555" stroke-width="2.5" marker-end="url(#a)">
    <line x1="190" y1="135" x2="213" y2="135"/><line x1="385" y1="135" x2="408" y2="135"/>
  </g>

  <!-- demand side -->
  <text x="40" y="242" font-size="14" font-weight="bold" fill="#3f6b34">DEMAND SIDE (per hectare, per crop)</text>
  <g font-size="12" fill="#222">
    <rect x="40" y="255" width="150" height="120" rx="10" fill="#e3efdd" stroke="#3f6b34"/>
    <text x="115" y="277" text-anchor="middle" font-weight="bold">Atmosphere</text>
    <text x="52" y="300">ET0 (Hargreaves or</text>
    <text x="52" y="317">Penman-Monteith)</text>
    <text x="52" y="340">from temperature,</text>
    <text x="52" y="357">latitude (stage 03)</text>

    <rect x="215" y="255" width="170" height="120" rx="10" fill="#e3efdd" stroke="#3f6b34"/>
    <text x="300" y="277" text-anchor="middle" font-weight="bold">Crop</text>
    <text x="227" y="300">ETc = ET0 x Kc</text>
    <text x="227" y="317">(FAO-56 Kc curve)</text>
    <text x="227" y="340">minus effective rain</text>
    <text x="227" y="357">= net requirement</text>

    <rect x="410" y="255" width="160" height="120" rx="10" fill="#e3efdd" stroke="#3f6b34"/>
    <text x="490" y="277" text-anchor="middle" font-weight="bold">Field method</text>
    <text x="422" y="300">divide by efficiency</text>
    <text x="422" y="317">furrow 0.6, drip 0.9</text>
    <text x="422" y="340">x 10 (mm to m3/ha)</text>
    <text x="422" y="363" font-style="italic" fill="#2f5022">= gross demand per ha</text>
  </g>
  <g stroke="#555" stroke-width="2.5" marker-end="url(#a)">
    <line x1="190" y1="315" x2="213" y2="315"/><line x1="385" y1="315" x2="408" y2="315"/>
  </g>

  <!-- compare -->
  <rect x="630" y="140" width="330" height="170" rx="12" fill="#1f2a20"/>
  <text x="795" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Compare every month</text>
  <g font-size="12.5" fill="#e7ebe4">
    <text x="648" y="196">Σ crops (ha x demand per ha)  ≤  supply</text>
    <text x="648" y="220">Binding month = where the ratio</text>
    <text x="648" y="238">supply / demand is smallest</text>
    <text x="648" y="262">Max irrigable ha per crop</text>
    <text x="648" y="286">Monthly limits → stage 04 planner</text>
  </g>
  <line x1="570" y1="135" x2="628" y2="190" stroke="#2f5d8a" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="570" y1="315" x2="628" y2="260" stroke="#3f6b34" stroke-width="2.5" marker-end="url(#a)"/>

  <text x="500" y="420" text-anchor="middle" font-size="12" fill="#5d665e">A seasonal total hides the lean month. The budget is checked month by month, like cash flow, not annual income.</text>
</svg>
