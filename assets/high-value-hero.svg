<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">High-value crops from irrigated plots</title>
<desc id="d">Drip-irrigated beds of onion, tomato, hot pepper, potato and garlic in a highland valley, with crates of produce ready for the buyer.</desc>
<style>.cloud{animation:drift 11s ease-in-out infinite alternate}.glow{animation:breathe 5s ease-in-out infinite}@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(14px)}}@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.65}}@media (prefers-reduced-motion:reduce){.cloud,.glow{animation:none}}</style>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe6f2"/><stop offset="1" stop-color="#f4efe2"/></linearGradient></defs>
<rect width="640" height="400" fill="url(#sky)"/>
<circle class="glow" cx="90" cy="64" r="56" fill="#ffe7a3" opacity=".5"/><circle cx="90" cy="64" r="28" fill="#f2c14e"/>
<g class="cloud" fill="#fff" opacity=".95"><ellipse cx="440" cy="58" rx="46" ry="16"/><ellipse cx="466" cy="48" rx="30" ry="20"/><ellipse cx="416" cy="54" rx="22" ry="14"/></g>
<path d="M0 170 L60 150 L140 152 L190 120 L300 120 L340 150 L640 142 L640 400 L0 400 Z" fill="#b9cfa4"/>
<path d="M0 220 C160 200 320 210 640 196 V400 H0Z" fill="#9dbb7f"/>
<path d="M0 250 C200 236 420 244 640 232 V400 H0Z" fill="#c8b483"/>
