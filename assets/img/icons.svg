  <symbol id="i-08" viewBox="0 0 24 24"><g class="s">
    <g transform="rotate(-45 13 10)"><rect x="11.2" y="8.2" width="3.6" height="3.6" rx=".7"/><rect x="5" y="8.5" width="4.4" height="3" rx=".4"/>
    <rect x="16.6" y="8.5" width="4.4" height="3" rx=".4"/><path d="M9.4 10h1.8M14.8 10h1.8M13 11.8v2"/></g>
    <path d="M3.5 16.5a4 4 0 0 0 4 4M3.5 13a7.5 7.5 0 0 0 7.5 7.5"/>
  </g></symbol>

