  <symbol id="i-07" viewBox="0 0 24 24"><g class="s">
    <path d="M12 15V8"/><path d="M12 10c0-3 2-5 5-5 0 3-2 5-5 5z"/><path d="M12 12c0-2.6-1.8-4.3-4.3-4.3 0 2.6 1.8 4.3 4.3 4.3z"/>
    <path d="M2.5 18c3-1.5 6-2 9.5-2s6.5.5 9.5 2"/><path d="M1.5 21.5c3.5-1.5 7-2 10.5-2s7 .5 10.5 2"/>
  </g></symbol>

