<svg xmlns="http://www.w3.org/2000/svg">
  <!-- AIAE icon sprite. 24x24 line icons, stroke = currentColor.
       Use: <svg class="icon" aria-hidden="true"><use href="/assets/img/icons.svg#i-01"/></svg> -->
  <defs>
    <style>.s{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>

  <!-- 01 Land intelligence: terraced hills with a survey pin -->
  <symbol id="i-01" viewBox="0 0 24 24"><g class="s">
    <path d="M2 19l6-8 4 5 3-4 7 7"/><path d="M5 16h4M9.5 13.5h3M14 15.5h4"/><path d="M2 21.5h20"/>
    <path d="M17 3.5a2.6 2.6 0 0 1 2.6 2.6c0 2-2.6 4.6-2.6 4.6s-2.6-2.6-2.6-4.6A2.6 2.6 0 0 1 17 3.5z"/><circle cx="17" cy="6.1" r=".7"/>
  </g></symbol>

  <!-- 02 Water: drop with ripple -->
  <symbol id="i-02" viewBox="0 0 24 24"><g class="s">
    <path d="M12 2.8s-6 6.6-6 10.6a6 6 0 0 0 12 0c0-4-6-10.6-6-10.6z"/><path d="M9 14.2a3 3 0 0 0 3 3"/>
    <path d="M2.5 21c1.5-1 3-1 4.5 0s3 1 4.5 0 3-1 4.5 0 3 1 4.5 0"/>
  </g></symbol>

  <!-- 03 Climate: sun behind cloud with rain -->
  <symbol id="i-03" viewBox="0 0 24 24"><g class="s">
    <path d="M8.5 4.5V3M4.2 6.2l-1-1M3 10.5H1.5M12.8 6.2l1-1"/><path d="M5.4 11.8a3.4 3.4 0 1 1 6.2-2.6"/>
    <path d="M7.5 17.5h10a3.5 3.5 0 0 0 .3-7 4.6 4.6 0 0 0-8.7 1.4 2.8 2.8 0 0 0-1.6 5.6z"/>
    <path d="M9 20.5l-.8 1.5M13 20.5l-.8 1.5M17 20.5l-.8 1.5"/>
  </g></symbol>

  <!-- 04 Crop planning: plan grid with a sprout -->
  <symbol id="i-04" viewBox="0 0 24 24"><g class="s">
    <rect x="2.5" y="4" width="14" height="16" rx="2"/><path d="M2.5 9.5h14M2.5 15h14M9.5 4v16"/>
    <path d="M19.5 21v-6"/><path d="M19.5 15c0-2.2 1.3-3.5 3-3.5 0 2.2-1.3 3.5-3 3.5z"/><path d="M19.5 17c0-1.8-1.1-2.8-2.5-2.8 0 1.8 1.1 2.8 2.5 2.8z"/>
  </g></symbol>

