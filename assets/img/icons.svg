    <path d="M12 22V7"/><path d="M12 7c-1.4-1-1.4-3 0-4.5 1.4 1.5 1.4 3.5 0 4.5z"/>
    <path d="M12 11c-1.8.3-3.4-.8-3.6-2.8 1.8-.3 3.4.8 3.6 2.8zM12 11c1.8.3 3.4-.8 3.6-2.8-1.8-.3-3.4.8-3.6 2.8z"/>
    <path d="M12 15c-1.8.3-3.4-.8-3.6-2.8 1.8-.3 3.4.8 3.6 2.8zM12 15c1.8.3 3.4-.8 3.6-2.8-1.8-.3-3.4.8-3.6 2.8z"/>
    <path d="M8 18.5l4 1.5 4-1.5"/>
  </g></symbol>

  <!-- 10 Storage: warehouse and silo -->
  <symbol id="i-10" viewBox="0 0 24 24"><g class="s">
    <path d="M2 10.5l7-4.5 7 4.5V21H2z"/><path d="M6 21v-5.5h6V21M6 18h6"/>
    <path d="M17.5 21V8.5a2.25 2.25 0 0 1 4.5 0V21"/><path d="M17.5 12h4.5M17.5 16h4.5M1 21h22"/>
  </g></symbol>

  <!-- 11 Logistics: truck on a road -->
  <symbol id="i-11" viewBox="0 0 24 24"><g class="s">
    <path d="M1.5 6.5h12V16h-12zM13.5 9.5h4l3 3.5V16h-7"/><circle cx="5.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>
    <path d="M1 21.5h4M8 21.5h4M15 21.5h4"/>
  </g></symbol>

  <!-- 12 Distribution and learning: coins with a return loop -->
  <symbol id="i-12" viewBox="0 0 24 24"><g class="s">
    <ellipse cx="9" cy="16" rx="5.5" ry="2.2"/><path d="M3.5 16v3c0 1.2 2.5 2.2 5.5 2.2s5.5-1 5.5-2.2v-3"/>
    <path d="M3.5 12.5c0-1.2 2.5-2.2 5.5-2.2s5.5 1 5.5 2.2-2.5 2.2-5.5 2.2"/>
    <path d="M15 4.5a5.5 5.5 0 0 1 6 7"/><path d="M21.8 9.2l-.8 2.3-2.2-.9"/><path d="M12 3.5l3 1-1 3"/>
  </g></symbol>

  <!-- Domains -->
  <symbol id="d-plan" viewBox="0 0 24 24"><g class="s">
    <circle cx="12" cy="12" r="9.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/><circle cx="12" cy="12" r=".6"/>
  </g></symbol>
  <symbol id="d-produce" viewBox="0 0 24 24"><g class="s">
    <path d="M12 21v-9"/><path d="M12 12c0-4 3-7 7.5-7 0 4-3 7-7.5 7z"/><path d="M12 15c0-3.4-2.4-5.8-6-5.8 0 3.4 2.4 5.8 6 5.8z"/><path d="M5 21h14"/>
  </g></symbol>
  <symbol id="d-move" viewBox="0 0 24 24"><g class="s">
    <path d="M3 8h14M13 4l4 4-4 4"/><path d="M21 16H7M11 12l-4 4 4 4"/>
  </g></symbol>
  <symbol id="d-sell" viewBox="0 0 24 24"><g class="s">
    <path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 3.5v4h-4"/><path d="M12 7.5v9M14.5 9.5c0-1-1.1-1.8-2.5-1.8s-2.5.8-2.5 1.9 1.1 1.6 2.5 1.9 2.5.9 2.5 2-1.1 1.9-2.5 1.9-2.5-.8-2.5-1.8"/>
  </g></symbol>

  <!-- UI -->
  <symbol id="u-search" viewBox="0 0 24 24"><g class="s"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></g></symbol>
  <symbol id="u-arrow-up" viewBox="0 0 24 24"><g class="s"><path d="M12 19V5M6 11l6-6 6 6"/></g></symbol>
  <symbol id="u-sun" viewBox="0 0 24 24"><g class="s"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></g></symbol>
  <symbol id="u-moon" viewBox="0 0 24 24"><g class="s"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></g></symbol>
  <symbol id="u-loop" viewBox="0 0 24 24"><g class="s"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.7 5.6L4 15.5M4 20v-4.5h4.5"/></g></symbol>
