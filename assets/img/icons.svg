  <symbol id="i-05" viewBox="0 0 24 24"><g class="s">
    <path d="M2.5 20.5h19"/><path d="M3.5 16l4.5-4.5 3.5 3 6-6.5"/><path d="M14 8h3.5v3.5"/>
    <path d="M18.5 15.5h3v3.5l-1.5 1.5-1.5-1.5z"/>
  </g></symbol>

  <!-- 06 Inputs: seed sack with scoop -->
  <symbol id="i-06" viewBox="0 0 24 24"><g class="s">
    <path d="M7 6.5h8l-1-3H8z"/><path d="M7 6.5c-2.5 2.5-3.5 6-3 10a4 4 0 0 0 4 3.5h6a4 4 0 0 0 4-3.5c.5-4-.5-7.5-3-10"/>
    <path d="M9 13c1 1.5 3 1.5 4 0M11 11v5"/><circle cx="20" cy="5" r="1"/><circle cx="21.5" cy="8" r=".8"/>
  </g></symbol>

