<text x="600.0" y="40" font-size="22" font-weight="800" text-anchor="middle">The chain as a self-improving network</text><g filter="url(#sh)"><rect x="47" y="70" width="204" height="300" rx="14" fill="#fff" stroke="#ddd8cb"/></g><path d="M47 84 a14 14 0 0 1 14 -14 h176 a14 14 0 0 1 14 14 v56 h-204 z" fill="#f1e8d6"/><circle cx="81" cy="106" r="18.0" fill="#fff" stroke="#74582a" stroke-width="1.5"/><svg x="69.0" y="94.0" width="24" height="24" style="color:#74582a"><use href="#i-01"/></svg><text x="111" y="112" font-size="17" font-weight="800">1 Land</text><circle cx="67" cy="164" r="3" fill="#74582a"/><circle cx="67" cy="185" r="3" fill="#74582a"/><circle cx="67" cy="206" r="3" fill="#74582a"/><circle cx="67" cy="227" r="3" fill="#74582a"/><circle cx="67" cy="248" r="3" fill="#74582a"/><text x="77" y="168" font-size="13" font-weight="normal" text-anchor="start">Soil, terrain, climate</text><text x="77" y="189" font-size="13" font-weight="normal" text-anchor="start">Water availability</text><text x="77" y="210" font-size="13" font-weight="normal" text-anchor="start">Land cover and tenure</text><text x="77" y="231" font-size="13" font-weight="normal" text-anchor="start">Suitability: FAO, AHP,</text><text x="77" y="252" font-size="13" font-weight="normal" text-anchor="start">deep learning</text><rect x="59" y="296" width="180" height="62" rx="9" fill="#f1e8d6"/><text x="71" y="315" font-size="11" font-weight="800" letter-spacing="1" style="fill:#74582a">OUTPUT</text><text x="71" y="333" font-size="12.5" font-weight="600" text-anchor="start">Where can what grow,</text><text x="71" y="348" font-size="12.5" font-weight="600" text-anchor="start">and how well</text><g filter="url(#sh)"><rect x="281" y="70" width="204" height="300" rx="14" fill="#fff" stroke="#ddd8cb"/></g><path d="M281 84 a14 14 0 0 1 14 -14 h176 a14 14 0 0 1 14 14 v56 h-204 z" fill="#e3efdd"/><circle cx="315" cy="106" r="18.0" fill="#fff" stroke="#3f6b34" stroke-width="1.5"/><svg x="303.0" y="94.0" width="24" height="24" style="color:#3f6b34"><use href="#i-07"/></svg><text x="345" y="112" font-size="17" font-weight="800">2 Production</text><circle cx="301" cy="164" r="3" fill="#3f6b34"/><circle cx="301" cy="185" r="3" fill="#3f6b34"/><circle cx="301" cy="206" r="3" fill="#3f6b34"/><circle cx="301" cy="227" r="3" fill="#3f6b34"/><text x="311" y="168" font-size="13" font-weight="normal" text-anchor="start">Crop and variety choice</text><text x="311" y="189" font-size="13" font-weight="normal" text-anchor="start">Seed and fertilizer</text><text x="311" y="210" font-size="13" font-weight="normal" text-anchor="start">Irrigation, oxen, tools</text><text x="311" y="231" font-size="13" font-weight="normal" text-anchor="start">Extension advice</text><rect x="293" y="296" width="180" height="62" rx="9" fill="#e3efdd"/><text x="305" y="315" font-size="11" font-weight="800" letter-spacing="1" style="fill:#3f6b34">OUTPUT</text><text x="305" y="333" font-size="12.5" font-weight="600" text-anchor="start">Yield, quality, risk</text><path d="M255 220.0 H276" stroke="#5d665e" stroke-width="2.5" marker-end="url(#ah-grey)"/><g filter="url(#sh)"><rect x="515" y="70" width="204" height="300" rx="14" fill="#fff" stroke="#ddd8cb"/></g><path d="M515 84 a14 14 0 0 1 14 -14 h176 a14 14 0 0 1 14 14 v56 h-204 z" fill="#dde8f3"/><circle cx="549" cy="106" r="18.0" fill="#fff" stroke="#2f5d8a" stroke-width="1.5"/><svg x="537.0" y="94.0" width="24" height="24" style="color:#2f5d8a"><use href="#i-10"/></svg><text x="579" y="112" font-size="17" font-weight="800">3 Post-harvest</text><circle cx="535" cy="164" r="3" fill="#2f5d8a"/><circle cx="535" cy="185" r="3" fill="#2f5d8a"/><circle cx="535" cy="206" r="3" fill="#2f5d8a"/><circle cx="535" cy="227" r="3" fill="#2f5d8a"/><text x="545" y="168" font-size="13" font-weight="normal" text-anchor="start">Drying and storage</text><text x="545" y="189" font-size="13" font-weight="normal" text-anchor="start">Aggregation by co-ops</text><text x="545" y="210" fon