<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' role="img" aria-labelledby="t d">
  <title id="t">Integrated agricultural intelligence platform</title>
  <desc id="d">Data sources feed one regional geospatial database. Analytical modules for the twelve stages read and write it, and a decision-support layer serves farmers, cooperatives, buyers, planners and transporters. A learning loop writes realised yields, prices and payments back into the database.</desc>
