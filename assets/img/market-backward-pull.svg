<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' role="img" aria-labelledby="t d">
  <title id="t">Plan backwards from the market, execute forwards from the land</title>
  <desc id="d">Top lane, right to left: buyer demand, logistics, crop and variety, water and climate, land suitability. They meet in the seasonal production plan. Bottom lane, left to right: inputs, planting and monitoring, forecast and harvest, storage and transport, delivery and payment. A feedback loop returns actual results to the plan.</desc>
