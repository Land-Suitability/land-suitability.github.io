<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fbfaf6"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2a20">Stage 01 domain model</text>

  <g font-size="12" fill="#222">
    <!-- PlanningCluster -->
    <rect x="30" y="55" width="200" height="95" rx="8" fill="#e3efdd" stroke="#3f6b34"/>
    <text x="130" y="76" text-anchor="middle" font-weight="bold">PlanningCluster</text>
    <line x1="30" y1="84" x2="230" y2="84" stroke="#3f6b34"/>
    <text x="42" y="102">cluster_id, name</text>
    <text x="42" y="120">plots: Plot[ ]</text>
    <text x="42" y="138">area_ha (derived)</text>

    <!-- Plot -->
    <rect x="30" y="200" width="200" height="135" rx="8" fill="#e3efdd" stroke="#3f6b34"/>
    <text x="130" y="221" text-anchor="middle" font-weight="bold">Plot (entity)</text>
    <line x1="30" y1="229" x2="230" y2="229" stroke="#3f6b34"/>
    <text x="42" y="247">plot_id, area_ha</text>
    <text x="42" y="265">holder_id (pseudonymous)</text>
    <text x="42" y="283">kebele, woreda, geometry</text>
    <text x="42" y="301">certificate_level</text>
    <text x="42" y="319">observations{ }</text>

    <!-- FactorObservation -->
    <rect x="300" y="200" width="200" height="115" rx="8" fill="#f1e8d6" stroke="#8a6d3b"/>
    <text x="400" y="221" text-anchor="middle" font-weight="bold">FactorObservation (value)</text>
    <line x1="300" y1="229" x2="500" y2="229" stroke="#8a6d3b"/>
    <text x="312" y="247">factor: LandFactor</text>
    <text x="312" y="265">value, std (uncertainty)</text>
    <text x="312" y="283">source, observed_on</text>

    <!-- LandFactor -->
    <rect x="300" y="55" width="200" height="95" rx="8" fill="#f1e8d6" stroke="#8a6d3b"/>
    <text x="400" y="76" text-anchor="middle" font-weight="bold">LandFactor (value)</text>
    <line x1="300" y1="84" x2="500" y2="84" stroke="#8a6d3b"/>
    <text x="312" y="102">code, name, unit</text>
    <text x="312" y="120">direction: range |</text>
    <text x="312" y="138">lower | higher is better</text>

    <!-- CropProfile / Requirement -->
    <rect x="570" y="55" width="200" height="95" rx="8" fill="#dde8f3" stroke="#2f5d8a"/>
    <text x="670" y="76" text-anchor="middle" font-weight="bold">CropProfile</text>
    <line x1="570" y1="84" x2="770" y2="84" stroke="#2f5d8a"/>
    <text x="582" y="102">crop, season</text>
    <text x="582" y="120">(meher | belg | dry)</text>
    <text x="582" y="138">requirements[ ]</text>

    <rect x="570" y="200" width="200" height="115" rx="8" fill="#dde8f3" stroke="#2f5d8a"/>
    <text x="670" y="221" text-anchor="middle" font-weight="bold">CropRequirement (value)</text>
    <line x1="570" y1="229" x2="770" y2="229" stroke="#2f5d8a"/>
    <text x="582" y="247">factor: LandFactor</text>
    <text x="582" y="265">breaks: S1 / S2 / S3 bands</text>
    <text x="582" y="283">weight (AHP)</text>
    <text x="582" y="301">note (provenance)</text>

    <!-- Assessment -->
    <rect x="300" y="360" width="470" height="95" rx="8" fill="#f5e1d7" stroke="#9a4a28" stroke-width="2"/>
    <text x="535" y="381" text-anchor="middle" font-weight="bold">SuitabilityAssessment (output contract to stages 02 and 04)</text>
    <line x1="300" y1="389" x2="770" y2="389" stroke="#9a4a28"/>
    <text x="312" y="407">target_id, crop, season, class (S1/S2/S3/N), score 0..1, uncertainty</text>
    <text x="312" y="425">limiting_factors[ ], factor_results[ ] (value, class, score per factor)</text>
    <text x="312" y="443">method (FAO limiting | AHP-WLC | deep learning), method_version</text>

    <!-- Scoring service -->
    <rect x="820" y="200" width="160" height="115" rx="8" fill="#1f2a20"/>
    <text x="900" y="225" text-anchor="middle" font-weight="bold" fill="#fff">Scoring service</text>
    <text x="832" y="250" fill="#e7ebe4">score_factor()</text>
    <text x="832" y="270" fill="#e7ebe4">ahp_weights()</text>
    <text x="832" y="290" fill="#e7ebe4">assess_grid()</text>
    <text x="832" y="308" fill="#e7ebe4">assess_plot()</text>
  </g>

  <g stroke="#555" stroke-width="1.8" fill="none" font-size="11" fill-opacity="1">
    <line x1="130" y1="150" x2="130" y2="198" marker-end="url(#a)"/>
    <line x1="230" y1="265" x2="298" y2="265" marker-end="url(#a)"/>
    <line x1="400" y1="200" x2="400" y2="152" marker-end="url(#a)"/>
    <line x1="670" y1="150" x2="670" y2="198" marker-end="url(#a)"/>
    <line x1="570" y1="245" x2="502" y2="120" marker-end="url(#a)"/>
    <line x1="770" y1="260" x2="818" y2="260" marker-end="url(#a)"/>
    <line x1="900" y1="315" x2="772" y2="400" marker-end="url(#a)"/>
    <line x1="130" y1="335" x2="298" y2="400" marker-end="url(#a)"/>
  </g>
  <g font-size="11" fill="#555">
    <text x="138" y="180">1..* plots</text>
    <text x="236" y="258">has</text>
    <text x="408" y="180">of</text>
    <text x="678" y="180">1..*</text>
    <text x="776" y="252">uses</text>
    <text x="830" y="350">produces</text>
    <text x="170" y="380">assessed as</text>
  </g>
</svg>
